name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PKG_CACHE_PATH: ${{ github.workspace }}/.pkg-cache

jobs:
  ci:
    name: Install · Build · Package · Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── AUTHORITATIVE CONFIG — written here, never read from repo ─────────────
      # This step generates config.json.example with the correct production values.
      # Whatever file exists in the repo is overwritten. This guarantees the
      # installer always bundles the right credentials regardless of repo state.
      - name: Write authoritative config.json.example
        shell: pwsh
        run: |
          $cfg = [ordered]@{
            agentCode           = "THERMOPAC-DOC-AGENT-01"
            erpBaseUrl          = "https://thermopac-communication-thermopacllp.replit.app"
            apiKey              = "5WHCLvEm2jGvuVKcS1paMkHQ62tWFgZr"
            allowedRootPath     = "\\\\SERVER\\d\\THERMOPAC"
            pollIntervalSeconds = 20
            maxConcurrentJobs   = 1
            logDir              = "C:\\ThermopacDocAgent\\logs"
            tempDir             = "C:\\ThermopacDocAgent\\temp"
          }
          $cfg | ConvertTo-Json -Depth 5 | Set-Content config.json.example -Encoding utf8
          Write-Output "=== config.json.example written ==="
          Get-Content config.json.example
          $sha = (Get-FileHash config.json.example -Algorithm SHA256).Hash.ToLower()
          Write-Output ""
          Write-Output "SHA256: $sha"

      # ── Diagnostics ───────────────────────────────────────────────────────────
      - name: Diagnose working directory and file layout
        shell: pwsh
        run: |
          Write-Output "=== Working directory ==="
          Get-Location
          Write-Output ""
          Write-Output "=== Files at root ==="
          Get-ChildItem -Name | Sort-Object
          Write-Output ""
          Write-Output "=== Key file presence ==="
          @('package.json','tsconfig.json','src','config.json.example','thermopac-doc-agent.iss') | ForEach-Object {
            $exists = (Test-Path $_)
            Write-Output "  $_ : $(if ($exists) { 'EXISTS' } else { 'MISSING' })"
          }
          if (Test-Path 'package.json') {
            $pkg = Get-Content package.json | ConvertFrom-Json
            Write-Output ""
            Write-Output "=== package.json identity ==="
            Write-Output "  name:    $($pkg.name)"
            Write-Output "  version: $($pkg.version)"
          }

      # ── Dependencies ──────────────────────────────────────────────────────────
      - name: Install dependencies
        timeout-minutes: 5
        run: npm install --no-fund --no-audit

      # ── TypeScript compile ────────────────────────────────────────────────────
      - name: Compile TypeScript
        id: build
        timeout-minutes: 5
        run: npm run build

      # ── Validate dist output ──────────────────────────────────────────────────
      - name: Validate dist/ output
        shell: pwsh
        run: |
          $required = @(
            'dist/index.js', 'dist/config.js', 'dist/api-client.js',
            'dist/job-runner.js', 'dist/file-service.js', 'dist/logger.js',
            'dist/path-guard.js', 'dist/hash-service.js', 'dist/service-health.js'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "Missing dist files: $($missing -join ', ')"; exit 1 }
          Write-Output "dist/ OK — $($required.Count) files verified."

      - name: Validate Windows service scripts
        shell: pwsh
        run: |
          $scripts = @('install-service.bat','uninstall-service.bat','start-service.bat','stop-service.bat')
          $missing = $scripts | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "Missing scripts: $($missing -join ', ')"; exit 1 }
          Write-Output "Service scripts OK."

      - name: Validate package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          if (-not $pkg.version) { Write-Error "Missing version"; exit 1 }
          if ($pkg.main -ne 'dist/index.js') { Write-Error "main must be dist/index.js, got: $($pkg.main)"; exit 1 }
          Write-Output "package.json OK — $($pkg.name) v$($pkg.version)"

      - name: Validate package structure (config + docs)
        shell: pwsh
        run: |
          $required = @('config.json.example','README.md','SETUP.md')
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "Missing package files: $($missing -join ', ')"; exit 1 }
          Write-Output "Package structure OK."

      # ── Config audit — verify exact values before anything is packaged ────────
      - name: Audit config.json.example values and SHA256
        shell: pwsh
        run: |
          Write-Output "=== config.json.example full content ==="
          Get-Content config.json.example
          Write-Output ""
          $sha = (Get-FileHash config.json.example -Algorithm SHA256).Hash.ToLower()
          Write-Output "SHA256(config.json.example): $sha"
          Write-Output ""
          $parsed = Get-Content config.json.example | ConvertFrom-Json
          Write-Output "=== Parsed field audit ==="
          Write-Output "  agentCode:       $($parsed.agentCode)"
          Write-Output "  erpBaseUrl:      $($parsed.erpBaseUrl)"
          Write-Output "  allowedRootPath: $($parsed.allowedRootPath)"
          Write-Output "  apiKey length:   $($parsed.apiKey.Length) chars"
          Write-Output "  apiKey prefix:   $($parsed.apiKey.Substring(0,4))…"
          Write-Output ""
          # Hard fail on any placeholder
          $placeholders = @('YOUR-ERP','CHANGE_ME','your-erp','changeme')
          $raw = Get-Content config.json.example -Raw
          foreach ($p in $placeholders) {
            if ($raw -match [regex]::Escape($p)) {
              Write-Error "FATAL: config.json.example contains placeholder '$p' — aborting build."
              exit 1
            }
          }
          # Verify expected values exactly
          if ($parsed.erpBaseUrl -ne "https://thermopac-communication-thermopacllp.replit.app") {
            Write-Error "FATAL: erpBaseUrl mismatch. Got: $($parsed.erpBaseUrl)"; exit 1
          }
          if ($parsed.agentCode -ne "THERMOPAC-DOC-AGENT-01") {
            Write-Error "FATAL: agentCode mismatch. Got: $($parsed.agentCode)"; exit 1
          }
          if ($parsed.apiKey.Length -lt 16) {
            Write-Error "FATAL: apiKey too short ($($parsed.apiKey.Length) chars)"; exit 1
          }
          Write-Output "Config audit PASSED — all values correct."

      # ── Version ───────────────────────────────────────────────────────────────
      - name: Get version from package.json
        id: get-version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ver = $pkg.version
          $zip = "ThermopacLocalDocumentAgent-v$ver-windows.zip"
          echo "version=$ver"  >> $env:GITHUB_OUTPUT
          echo "zip-name=$zip" >> $env:GITHUB_OUTPUT
          Write-Output "Packaging: $zip"

      # ── ZIP package ───────────────────────────────────────────────────────────
      - name: Create installable Windows package ZIP
        shell: pwsh
        run: |
          $zipName = "${{ steps.get-version.outputs.zip-name }}"
          $staging = "staging-release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item -Recurse dist           "$staging\dist"
          Copy-Item package.json            "$staging\"
          Copy-Item config.json.example     "$staging\"
          Copy-Item README.md               "$staging\"
          Copy-Item SETUP.md                "$staging\"
          Copy-Item install-service.bat     "$staging\"
          Copy-Item uninstall-service.bat   "$staging\"
          Copy-Item start-service.bat       "$staging\"
          Copy-Item stop-service.bat        "$staging\"
          "${{ steps.get-version.outputs.version }}" | Out-File "$staging\VERSION.txt" -Encoding utf8

          Compress-Archive -Path "$staging\*" -DestinationPath $zipName -CompressionLevel Optimal
          $size = [math]::Round((Get-Item $zipName).Length / 1KB, 1)
          Write-Output "Created $zipName ($size KB)"

      - name: Validate ZIP contents
        shell: pwsh
        run: |
          $zip = "${{ steps.get-version.outputs.zip-name }}"
          Expand-Archive -Path $zip -DestinationPath zip-check\ -Force
          $required = @('dist\index.js','package.json','config.json.example','install-service.bat','uninstall-service.bat','start-service.bat','stop-service.bat','README.md','SETUP.md','VERSION.txt')
          foreach ($f in $required) {
            if (-not (Test-Path "zip-check\$f")) { Write-Error "ZIP missing: $f"; exit 1 }
          }
          # Verify config inside ZIP has correct values too
          $zipCfg = Get-Content "zip-check\config.json.example" | ConvertFrom-Json
          if ($zipCfg.erpBaseUrl -ne "https://thermopac-communication-thermopacllp.replit.app") {
            Write-Error "ZIP config.json.example has wrong erpBaseUrl: $($zipCfg.erpBaseUrl)"; exit 1
          }
          Write-Output "ZIP validation passed — all required files present, config values correct."

      - name: Upload installable package artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get-version.outputs.zip-name }}
          path: ${{ steps.get-version.outputs.zip-name }}
          retention-days: 14

      # ── Standalone Windows installer (setup.exe) ─────────────────────────────
      - name: Cache pkg Node.js binary (node20-win-x64)
        uses: actions/cache@v4
        with:
          path: .pkg-cache
          key: pkg-node20-win-x64-${{ runner.os }}-v1

      - name: Bundle agent into standalone executable (pkg)
        timeout-minutes: 15
        shell: pwsh
        env:
          PKG_CACHE_PATH: ${{ github.workspace }}/.pkg-cache
        run: |
          Write-Output "=== pkg: bundling Node.js 20 + agent into single exe ==="
          $pkgBin = ".\node_modules\.bin\pkg.cmd"
          if (-not (Test-Path $pkgBin)) { $pkgBin = ".\node_modules\.bin\pkg" }
          if (-not (Test-Path $pkgBin)) {
            Write-Error "pkg binary not found in node_modules/.bin"
            Get-ChildItem .\node_modules\.bin\ | Where-Object Name -like "pkg*"
            exit 1
          }
          Write-Output "Using pkg at: $pkgBin"
          & $pkgBin dist/index.js --target node20-win-x64 --output ThermopacDocAgent.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "pkg exited with code $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path ThermopacDocAgent.exe)) { Write-Error "ThermopacDocAgent.exe not found"; exit 1 }
          $size = [math]::Round((Get-Item ThermopacDocAgent.exe).Length / 1MB, 1)
          Write-Output "Built ThermopacDocAgent.exe ($size MB)"

      - name: Write VERSION.txt for Inno Setup
        shell: pwsh
        run: |
          "${{ steps.get-version.outputs.version }}" | Out-File VERSION.txt -Encoding utf8 -NoNewline

      # ── Pre-installer SHA256 audit — every file Inno Setup will read ──────────
      - name: SHA256 audit of all Inno Setup source files
        shell: pwsh
        run: |
          Write-Output "=== SHA256 audit — files Inno Setup will package ==="
          $files = @(
            'ThermopacDocAgent.exe',
            'config.json.example',
            'README.md',
            'SETUP.md',
            'VERSION.txt',
            'thermopac-doc-agent.iss'
          )
          foreach ($f in $files) {
            if (Test-Path $f) {
              $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              $sz = [math]::Round((Get-Item $f).Length / 1KB, 1)
              Write-Output "  $h  $f  ($sz KB)"
            } else {
              Write-Output "  MISSING: $f"
            }
          }
          Write-Output ""
          Write-Output "=== config.json.example full text at installer input ==="
          Get-Content config.json.example
          Write-Output ""
          # Final hard check immediately before ISCC runs
          $raw = Get-Content config.json.example -Raw
          if ($raw -match 'YOUR-ERP' -or $raw -match 'CHANGE_ME') {
            Write-Error "FATAL: placeholder values still in config.json.example — installer aborted."
            exit 1
          }
          Write-Output "Pre-installer audit PASSED."

      - name: Install Inno Setup 6
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" `
            -OutFile $out -UseBasicParsing -TimeoutSec 120
          Start-Process -FilePath $out -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found after install"; exit 1 }
          Write-Output "Inno Setup 6 installed: $iscc"

      - name: Patch version into setup.iss
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          (Get-Content thermopac-doc-agent.iss) `
            -replace '#define MyAppVersion\s+"[^"]+"', "#define MyAppVersion   `"$version`"" |
            Set-Content thermopac-doc-agent.iss
          Write-Output "Version patched to: $version"

      - name: Build setup.exe (Inno Setup)
        timeout-minutes: 10
        shell: pwsh
        run: |
          Write-Output "=== ISCC: compiling setup.exe ==="
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          & $iscc thermopac-doc-agent.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup build failed (exit $LASTEXITCODE)"; exit 1 }
          $exe = "installer_output\ThermopacLocalDocumentAgentSetup-v${{ steps.get-version.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { Write-Error "setup.exe not found: $exe"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "Built $exe ($size MB)"

      - name: Validate setup.exe is non-trivial
        shell: pwsh
        run: |
          $exe = "installer_output\ThermopacLocalDocumentAgentSetup-v${{ steps.get-version.outputs.version }}.exe"
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "setup.exe size: $sizeMB MB"
          if ((Get-Item $exe).Length -lt 10MB) {
            Write-Error "setup.exe too small ($sizeMB MB) — pkg bundling may have failed"
            exit 1
          }
          Write-Output "setup.exe validation passed."

      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $exe = "installer_output\ThermopacLocalDocumentAgentSetup-v$version.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          Write-Output "SHA-256: $hash"
          "$hash  ThermopacLocalDocumentAgentSetup-v$version.exe" |
            Out-File "installer_output\SHA256SUMS.txt" -Encoding utf8

      - name: Upload setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermopacLocalDocumentAgentSetup-v${{ steps.get-version.outputs.version }}
          path: |
            installer_output/ThermopacLocalDocumentAgentSetup-v${{ steps.get-version.outputs.version }}.exe
            installer_output/SHA256SUMS.txt
          retention-days: 14
