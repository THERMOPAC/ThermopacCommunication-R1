name: Agent — Build & Package Validation

on:
  push:
    paths:
      - 'local-document-agent/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'local-document-agent/**'
      - '.github/workflows/build.yml'

defaults:
  run:
    working-directory: local-document-agent

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript (strict)
        run: npm run build

      - name: Verify dist output
        shell: pwsh
        run: |
          $required = @('dist/index.js', 'dist/config.js', 'dist/api-client.js', 'dist/job-runner.js', 'dist/file-service.js', 'dist/logger.js')
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing expected output files: $($missing -join ', ')"
            exit 1
          }
          Write-Output "All required dist files present:"
          Get-ChildItem dist -Recurse | Select-Object FullName

      - name: Validate package metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          if (-not $pkg.version) { Write-Error "package.json missing version"; exit 1 }
          if (-not $pkg.main)    { Write-Error "package.json missing main";    exit 1 }
          Write-Output "Package: $($pkg.name) v$($pkg.version) — main: $($pkg.main)"

      - name: Validate Windows batch scripts exist
        shell: pwsh
        run: |
          $scripts = @('install-service.bat', 'uninstall-service.bat', 'start-service.bat', 'stop-service.bat')
          foreach ($s in $scripts) {
            if (-not (Test-Path $s)) { Write-Error "Missing: $s"; exit 1 }
          }
          Write-Output "All Windows service scripts present."

      - name: Get version from package.json
        id: get-version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ver = $pkg.version
          $zip = "ThermopacLocalDocumentAgent-v$ver-windows.zip"
          echo "version=$ver"   >> $env:GITHUB_OUTPUT
          echo "zip-name=$zip"  >> $env:GITHUB_OUTPUT
          Write-Output "Packaging release: $zip"

      - name: Create installable Windows package ZIP
        shell: pwsh
        run: |
          $zipName = "${{ steps.get-version.outputs.zip-name }}"
          $staging = "staging-release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item -Recurse dist           "$staging\dist"
          Copy-Item package.json            "$staging\"
          Copy-Item config.json.example     "$staging\"
          Copy-Item README.md               "$staging\"
          Copy-Item SETUP.md                "$staging\"
          Copy-Item install-service.bat     "$staging\"
          Copy-Item uninstall-service.bat   "$staging\"
          Copy-Item start-service.bat       "$staging\"
          Copy-Item stop-service.bat        "$staging\"
          "${{ steps.get-version.outputs.version }}" | Out-File "$staging\VERSION.txt" -Encoding utf8

          Compress-Archive -Path "$staging\*" -DestinationPath $zipName -CompressionLevel Optimal
          $size = [math]::Round((Get-Item $zipName).Length / 1KB, 1)
          Write-Output "Created $zipName ($size KB)"
          Get-ChildItem $staging -Recurse | Select-Object -ExpandProperty Name | ForEach-Object { Write-Output "  $_" }

      - name: Validate ZIP contents
        shell: pwsh
        run: |
          $zip = "${{ steps.get-version.outputs.zip-name }}"
          Expand-Archive -Path $zip -DestinationPath zip-check\ -Force
          $required = @('dist\index.js','package.json','config.json.example','install-service.bat','uninstall-service.bat','start-service.bat','stop-service.bat','README.md','SETUP.md','VERSION.txt')
          foreach ($f in $required) {
            if (-not (Test-Path "zip-check\$f")) { Write-Error "ZIP missing: $f"; exit 1 }
          }
          Write-Output "ZIP validation passed — all required files present."

      - name: Upload installable package artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get-version.outputs.zip-name }}
          path: local-document-agent/${{ steps.get-version.outputs.zip-name }}
          retention-days: 30

      # ── Standalone Windows installer (setup.exe) ─────────────────────────────
      # Uses @yao-pkg/pkg to bundle Node.js 20 runtime into a single exe,
      # then Inno Setup to wrap it into a one-click setup.exe.
      # No Node.js installation required on the target machine.

      - name: Bundle agent into standalone executable (pkg)
        shell: pwsh
        run: |
          npx --yes @yao-pkg/pkg@latest dist/index.js --target node20-win-x64 --output ThermopacDocAgent.exe
          if (-not (Test-Path ThermopacDocAgent.exe)) { Write-Error "pkg build failed — ThermopacDocAgent.exe not found"; exit 1 }
          $size = [math]::Round((Get-Item ThermopacDocAgent.exe).Length / 1MB, 1)
          Write-Output "Built ThermopacDocAgent.exe ($size MB)"

      - name: Write VERSION.txt for Inno Setup
        shell: pwsh
        run: |
          "${{ steps.get-version.outputs.version }}" | Out-File VERSION.txt -Encoding utf8 -NoNewline

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup 6 not found at expected path"; exit 1 }
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & $iscc thermopac-doc-agent.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup build failed (exit $LASTEXITCODE)"; exit 1 }
          $exe = "installer-output\ThermopacLocalDocumentAgentSetup-v${{ steps.get-version.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { Write-Error "setup.exe not found after build: $exe"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "Built $exe ($size MB)"

      - name: Validate setup.exe is non-trivial
        shell: pwsh
        run: |
          $exe = "installer-output\ThermopacLocalDocumentAgentSetup-v${{ steps.get-version.outputs.version }}.exe"
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "setup.exe size: $sizeMB MB"
          if ((Get-Item $exe).Length -lt 10MB) {
            Write-Error "setup.exe too small ($sizeMB MB) — pkg bundling may have failed"
            exit 1
          }
          Write-Output "setup.exe validation passed."

      - name: Upload setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermopacLocalDocumentAgentSetup-v${{ steps.get-version.outputs.version }}.exe
          path: local-document-agent/installer-output/ThermopacLocalDocumentAgentSetup-v${{ steps.get-version.outputs.version }}.exe
          retention-days: 30

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: local-document-agent/
          retention-days: 5
