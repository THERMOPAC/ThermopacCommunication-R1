name: Agent — Release & Windows Package

on:
  release:
    types: [published]
  push:
    tags:
      - 'local-agent/v*.*.*'
  pull_request:
    paths:
      - 'local-document-agent/**'
      - '.github/workflows/release.yml'

defaults:
  run:
    working-directory: local-document-agent

jobs:
  build-and-package:
    name: Build & Package (Windows)
    runs-on: windows-latest

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      zip-name: ${{ steps.get-version.outputs.zip-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript (strict — fail on any error)
        run: npm run build

      - name: Get version from package.json
        id: get-version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ver = $pkg.version
          $zip = "ThermopacLocalDocumentAgent-v$ver-windows.zip"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "zip-name=$zip" >> $env:GITHUB_OUTPUT
          Write-Output "Building release package: $zip"

      - name: Verify all dist files compiled
        shell: pwsh
        run: |
          $required = @(
            'dist/index.js',
            'dist/config.js',
            'dist/api-client.js',
            'dist/job-runner.js',
            'dist/file-service.js',
            'dist/logger.js',
            'dist/path-guard.js',
            'dist/hash-service.js',
            'dist/service-health.js'
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Release blocked — missing compiled files: $($missing -join ', ')"
            exit 1
          }
          Write-Output "All $($required.Count) required dist files present."

      - name: Validate Windows package artefacts
        shell: pwsh
        run: |
          $artefacts = @(
            'install-service.bat',
            'uninstall-service.bat',
            'start-service.bat',
            'stop-service.bat',
            'config.json.example',
            'README.md',
            'SETUP.md',
            'package.json',
            'tsconfig.json'
          )
          foreach ($a in $artefacts) {
            if (-not (Test-Path $a)) { Write-Error "Missing required artefact: $a"; exit 1 }
          }
          Write-Output "All required package artefacts present."

      - name: Create Windows release ZIP
        shell: pwsh
        run: |
          $zipName = "${{ steps.get-version.outputs.zip-name }}"
          $stagingDir = "staging-release"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          # Copy runtime artefacts
          Copy-Item -Recurse dist       "$stagingDir\dist"
          Copy-Item package.json        "$stagingDir\"
          Copy-Item tsconfig.json       "$stagingDir\"
          Copy-Item config.json.example "$stagingDir\"
          Copy-Item README.md           "$stagingDir\"
          Copy-Item SETUP.md            "$stagingDir\"
          Copy-Item install-service.bat   "$stagingDir\"
          Copy-Item uninstall-service.bat "$stagingDir\"
          Copy-Item start-service.bat     "$stagingDir\"
          Copy-Item stop-service.bat      "$stagingDir\"

          # Write a VERSION file
          "${{ steps.get-version.outputs.version }}" | Out-File "$stagingDir\VERSION.txt" -Encoding utf8

          # Compress
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -CompressionLevel Optimal
          $size = (Get-Item $zipName).Length / 1KB
          Write-Output "Created $zipName ($([math]::Round($size, 1)) KB)"

      - name: Upload release ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get-version.outputs.zip-name }}
          path: local-document-agent/${{ steps.get-version.outputs.zip-name }}
          retention-days: 90

      - name: Attach ZIP to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $zip = "${{ steps.get-version.outputs.zip-name }}"
          gh release upload "${{ github.event.release.tag_name }}" $zip --clobber
          Write-Output "Uploaded $zip to release ${{ github.event.release.tag_name }}"

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs-${{ github.sha }}
          path: local-document-agent/
          retention-days: 5

  validate-package:
    name: Validate ZIP integrity
    needs: build-and-package
    runs-on: windows-latest

    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-and-package.outputs.zip-name }}
          path: downloaded/

      - name: Inspect ZIP contents
        shell: pwsh
        run: |
          $zip = Get-Item downloaded\*.zip
          Write-Output "Downloaded: $($zip.Name) ($([math]::Round($zip.Length / 1KB, 1)) KB)"
          Expand-Archive -Path $zip.FullName -DestinationPath extracted\
          $files = Get-ChildItem extracted -Recurse | Select-Object -ExpandProperty Name
          Write-Output "Contents ($($files.Count) files):"
          $files | ForEach-Object { Write-Output "  $_" }

      - name: Assert required files in ZIP
        shell: pwsh
        run: |
          $required = @('dist\index.js', 'package.json', 'config.json.example', 'install-service.bat', 'README.md', 'VERSION.txt')
          foreach ($f in $required) {
            $path = "extracted\$f"
            if (-not (Test-Path $path)) {
              Write-Error "ZIP validation failed — missing: $f"
              exit 1
            }
          }
          Write-Output "ZIP integrity check passed — all required files present."
