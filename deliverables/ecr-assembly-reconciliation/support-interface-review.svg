994 mm</text><text x="350" y="622" class="warn">0.059994 beyond inner envelope</text><text x="20" y="666">Detail is exaggerated; not to scale. Specify shell-conformal termination / weld.</text><text x="20" y="690">This is an inherited assembly-interface issue, not turbine/stator interference.</text><text x="20" y="714">Housing bore, support joints and lower journal engagement remain undefined.</text><text x="20" y="750">No approved component dimension changed; no historical support solid overwritten.</text></svg>