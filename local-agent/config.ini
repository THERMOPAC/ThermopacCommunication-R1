; ThermopacAgent — configuration file
; Edit the values below before starting the agent.
;
; AUTO-FILLED defaults (applied when value is blank or missing):
;   api_url             → http://localhost:3000
;   node_id             → Windows machine name (e.g. DESKTOP-ABC123)
;   solidworks_version  → auto-detected from Windows registry (newest installed)
;
; REQUIRED — must be set manually:
;   node_token          → issued by Thermopac admin (never auto-generated)

[cloud]
; API base URL — no trailing slash
; Default: http://localhost:3000  (change to production URL when ready)
api_url    = http://localhost:3000

; Node identifier — leave blank to auto-fill from machine name
node_id    =

; Authentication token — REQUIRED — obtain from Thermopac admin
; Steps: EPC → Drawing Controls → Agent Nodes → Register New Node → copy token
node_token = REPLACE_WITH_YOUR_TOKEN

[agent]
; Seconds between poll cycles
poll_interval_sec = 10

; Maximum seconds for one job (download + extraction + upload)
; Job is marked failed and SolidWorks is shut down if exceeded
job_timeout_sec = 600

; Maximum retry attempts before a job is permanently failed
max_retries = 3

[paths]
; Temp folder for .slddrw files during extraction
temp_dir = C:\ThermopacAgent\temp

; Log folder (daily rotation, 30-day retention)
log_dir = C:\ThermopacAgent\logs

[solidworks]
; SolidWorks version installed on this machine
; Leave as 0 to auto-detect from Windows registry
; Set manually if auto-detection picks the wrong version
; Supported values: 2019, 2020, 2021, 2022, 2023, 2024
solidworks_version = 0

; Optional: override COM ProgID directly (leave blank — resolved from version above)
; Example: SldWorks.Application.27
; solidworks_progid =

; Set true only for debugging — keeps SolidWorks window visible during extraction
visible = false
