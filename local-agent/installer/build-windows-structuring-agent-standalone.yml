name: Build Structuring Agent Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent version (e.g. 1.0.37)'
        required: true
        default: '1.0.37'
  push:
    paths:
      - 'agent/**'
      - 'structurer/**'
      - 'installer/**'
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Structuring Agent Installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywin32 requests pyinstaller pywin32-ctypes

      # ── Source verification — fail before build if source is dirty ─────────
      - name: Verify source — no _rev- filenames, no extractor imports
        run: |
          $failed = $false

          $pyFiles = Get-ChildItem -Path agent,structurer -Recurse -Filter "*.py" -ErrorAction SilentlyContinue

          foreach ($f in $pyFiles) {
            $content = Get-Content $f.FullName -Raw -Encoding UTF8

            # Catch ANY _rev-{...} or _Rev-{...} token in a filename/slddrw context.
            # Broadened from the original narrow {revision}|{rev} pattern to any variable name.
            # Also catches _Rev- (capital R) and bare string literals like _rev-A.
            $lines = $content -split "`n"
            foreach ($line in $lines) {
              # Skip comment lines and lines that are clearly diagnostic/test strings
              $trimmed = $line.TrimStart()
              if ($trimmed.StartsWith('#') -or $trimmed.StartsWith('//') -or $trimmed.StartsWith("'")) { continue }
              # Flag: any line that assigns a .slddrw filename and contains _rev- or _Rev-
              if ($line -match '\.slddrw' -and ($line -match '_rev-' -or $line -match '_Rev-')) {
                # Exclude lines that are string literals inside _check_source / test / diagnostic functions
                if ($line -notmatch '^\s*(#|if|print|Write|echo|return|assert|raise|msg|message|pattern|has_rev|still_has|_rev-.*check|_rev-.*FOUND|_rev-.*BUG|_rev-.*FAIL|_rev-.*PASS|_rev-.*OK)') {
                  Write-Error "FAIL: _rev- + .slddrw filename pattern in $($f.FullName): $($line.Trim())"
                  $failed = $true
                }
              }
              # Also catch any f-string or string that constructs a filename with _rev- directly
              if ($line -match 'filename\s*=.*_rev-') {
                Write-Error "FAIL: filename assignment with _rev- in $($f.FullName): $($line.Trim())"
                $failed = $true
              }
            }

            if ($content -match 'from extractor\.' -or $content -match 'import extractor') {
              Write-Error "FAIL: extractor import in $($f.FullName)"
              $failed = $true
            }
          }

          if (Test-Path extractor) {
            Write-Error "FAIL: extractor\ directory must not exist in structuring agent build"
            $failed = $true
          }

          if ($failed) { exit 1 }
          Write-Host "PASS: source clean — no _rev- patterns, no extractor imports"

      - name: Build dist with PyInstaller
        run: |
          pyinstaller `
            --name ThermopacStructuringAgent `
            --onedir `
            --console `
            --clean `
            --noconfirm `
            --distpath dist `
            --workpath build `
            --specpath . `
            --add-data "agent;agent" `
            --add-data "structurer;structurer" `
            --hidden-import win32com `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            --hidden-import win32api `
            --hidden-import win32con `
            --hidden-import requests `
            --hidden-import configparser `
            --hidden-import hashlib `
            --paths agent `
            --paths structurer `
            agent\main_structurer.py

      - name: Verify dist structure
        run: |
          $exe = "dist\ThermopacStructuringAgent\ThermopacStructuringAgent.exe"
          if (!(Test-Path $exe)) {
            Write-Error "ThermopacStructuringAgent.exe not found: $exe"
            Get-ChildItem dist -Recurse -ErrorAction SilentlyContinue
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "EXE found: $exe ($sizeMB MB)"

          # Verify no extractor in dist
          if (Test-Path "dist\ThermopacStructuringAgent\extractor") {
            Write-Error "FAIL: extractor\ found in dist — build is contaminated"
            exit 1
          }
          Write-Host "PASS: no extractor\ in dist"

      # ── Post-dist verification — scan the PACKAGED .py files, not just source ──
      # PyInstaller copies source .py files into dist via --add-data.
      # This step verifies that the files actually bundled are also clean,
      # catching any case where the build pipeline accidentally picked up
      # old sources from a different directory.
      - name: Verify dist — no _rev-, no __pycache__, no .pyc in package
        run: |
          $failed = $false
          $distRoot = "dist\ThermopacStructuringAgent"

          # ── Check 1: no __pycache__ directories ──────────────────────────────
          $cacheDirs = Get-ChildItem -Path $distRoot -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue
          if ($cacheDirs) {
            foreach ($d in $cacheDirs) {
              Write-Error "FAIL: __pycache__ directory found in dist: $($d.FullName)"
            }
            $failed = $true
          } else {
            Write-Host "PASS: no __pycache__ directories in dist"
          }

          # ── Check 2: no .pyc files ────────────────────────────────────────────
          $pycFiles = Get-ChildItem -Path $distRoot -Recurse -Filter "*.pyc" -ErrorAction SilentlyContinue
          if ($pycFiles) {
            foreach ($f in $pycFiles) {
              Write-Error "FAIL: .pyc file found in dist: $($f.FullName)"
            }
            $failed = $true
          } else {
            Write-Host "PASS: no .pyc files in dist"
          }

          # ── Check 3: no _rev- filename logic in any .py file ─────────────────
          $distPy = Get-ChildItem -Path $distRoot -Recurse -Filter "*.py" -ErrorAction SilentlyContinue
          foreach ($f in $distPy) {
            $content = Get-Content $f.FullName -Raw -Encoding UTF8
            if ($content -match 'filename\s*=.*_rev-') {
              Write-Error "FAIL: _rev- filename assignment in $($f.FullName)"
              $failed = $true
            }
            if ($f.Name -eq "solidworks_structurer.py") {
              if ($content -match '_rev-\{[^}]+\}\.slddrw|_Rev-\{[^}]+\}\.slddrw') {
                Write-Error "FAIL: _rev- slddrw pattern in packaged solidworks_structurer.py"
                $failed = $true
              } elseif ($content -match 'safe_rev\s*=') {
                Write-Error "FAIL: safe_rev variable found in packaged solidworks_structurer.py"
                $failed = $true
              } else {
                Write-Host "PASS: solidworks_structurer.py — no _rev- pattern, no safe_rev"
              }
              if ($content -notmatch 'filename\s*=\s*f"\{safe_dn\}\.slddrw"') {
                Write-Error "FAIL: expected 'filename = f\"{safe_dn}.slddrw\"' not found"
                $failed = $true
              } else {
                Write-Host "PASS: correct filename = f`"{safe_dn}.slddrw`" confirmed"
              }
            }
          }

          if ($failed) { exit 1 }
          Write-Host "PASS: dist is clean — no _rev-, no __pycache__, no .pyc files"

      - name: Install Inno Setup 6
        run: |
          $out = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          Write-Host "Inno Setup installed"

      - name: Patch version in setup.iss
        run: |
          $version = "${{ github.event.inputs.version || '1.0.37' }}"
          (Get-Content "installer\setup.iss") `
            -replace '#define AppVersion\s+"[^"]+"', "#define AppVersion      `"$version`"" |
            Set-Content "installer\setup.iss"
          Write-Host "Version patched to: $version"

      - name: Compile installer EXE (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) {
            Write-Error "ISCC.exe not found after installation"
            exit 1
          }
          & $iscc "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Verify installer output
        run: |
          $version = "${{ github.event.inputs.version || '1.0.37' }}"
          $installer = "installer_output\ThermopacStructuringAgent-Setup-v$version.exe"
          if (!(Test-Path $installer)) {
            Write-Host "Contents of installer_output\:"
            Get-ChildItem installer_output -ErrorAction SilentlyContinue
            Write-Error "Installer not found: $installer"
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Installer: $installer ($sizeMB MB)"

      - name: Compute SHA-256 checksum
        run: |
          $version = "${{ github.event.inputs.version || '1.0.37' }}"
          $installer = "installer_output\ThermopacStructuringAgent-Setup-v$version.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          "$hash  ThermopacStructuringAgent-Setup-v$version.exe" |
            Out-File "installer_output\SHA256SUMS.txt" -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermopacStructuringAgent-Setup-v${{ github.event.inputs.version || '1.0.37' }}
          path: |
            installer_output/ThermopacStructuringAgent-Setup-v*.exe
            installer_output/SHA256SUMS.txt
          retention-days: 30

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermopacStructuringAgent-dist-v${{ github.event.inputs.version || '1.0.37' }}
          path: dist/ThermopacStructuringAgent/
          retention-days: 7
