name: Build Structuring Agent Installer

on:
  push:
    paths:
      - 'agent/**'
      - 'extractor/**'
      - 'structurer/**'
      - 'installer/**'
      - '.github/workflows/build-structuring-agent.yml'
  workflow_dispatch:

jobs:
  build-installer:
    name: Build Structuring Agent Installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup already available: $iscc"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Build dist (Python + agent sources)
        shell: cmd
        env:
          CI: 'true'
        run: installer\build-installer.bat

      - name: Verify dist structure
        shell: pwsh
        run: |
          $dist = "dist\ThermopacStructuringAgent"
          Write-Host "=== dist contents ==="
          Get-ChildItem -Recurse $dist | Select-Object FullName | Format-Table -AutoSize

          $required = @(
            "$dist\agent\main_structurer.py",
            "$dist\agent\structure_job_client.py",
            "$dist\extractor\sw_instance.py",
            "$dist\structurer\solidworks_structurer.py",
            "$dist\run.bat",
            "$dist\config.ini"
          )
          $ok = $true
          foreach ($f in $required) {
            if (Test-Path $f) {
              Write-Host "[OK] $f"
            } else {
              Write-Error "[MISSING] $f"
              $ok = $false
            }
          }
          if (-not $ok) { exit 1 }

      - name: Compile installer EXE
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
          if errorlevel 1 (
            echo [ERROR] ISCC compilation failed
            exit /b 1
          )
          echo [OK] Installer compiled successfully

      - name: Verify installer output
        id: verify
        shell: pwsh
        run: |
          Write-Host "--- installer_output contents ---"
          Get-ChildItem "installer_output" -ErrorAction SilentlyContinue | Format-Table Name, Length

          $exes = Get-ChildItem "installer_output\ThermopacStructuringAgent-Setup-v*.exe" -ErrorAction SilentlyContinue
          if (-not $exes) {
            Write-Error "No ThermopacStructuringAgent-Setup-v*.exe found in installer_output\"
            exit 1
          }

          $exe = $exes | Sort-Object Name | Select-Object -Last 1
          $ver = $exe.BaseName -replace 'ThermopacStructuringAgent-Setup-v', ''

          Write-Host "[OK] $($exe.Name)"
          Write-Host "     Version: $ver"
          Write-Host "     Size: $([math]::Round($exe.Length / 1MB, 2)) MB ($($exe.Length) bytes)"

          echo "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          echo "version=$ver"          >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.exe_name }}
          path: installer_output/${{ steps.verify.outputs.exe_name }}
          retention-days: 90
          if-no-files-found: error

      - name: Write build summary
        shell: pwsh
        if: always()
        run: |
          $exes = Get-ChildItem "installer_output\ThermopacStructuringAgent-Setup-v*.exe" -ErrorAction SilentlyContinue
          $exe  = $exes | Sort-Object Name | Select-Object -Last 1
          $ver    = if ($exe) { $exe.BaseName -replace 'ThermopacStructuringAgent-Setup-v','' } else { 'unknown' }
          $size   = if ($exe) { "$([math]::Round($exe.Length / 1MB, 2)) MB" } else { 'N/A' }
          $exists = [bool]$exe

          @"
          ## ThermopacStructuringAgent v$ver Installer Build

          | Item | Value |
          |---|---|
          | Version | v$ver |
          | Runner | windows-latest |
          | Python bundled | 3.11.9 embeddable |
          | SolidWorks COM cache | Generated at first agent startup |
          | Installer EXE | $($exe.Name) |
          | EXE size | $size |
          | EXE produced | $exists |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
