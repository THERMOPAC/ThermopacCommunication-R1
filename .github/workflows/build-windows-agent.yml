name: Build ThermopacAgent Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent version override (leave blank to auto-read from job_client.py)'
        required: false
        default: ''
  push:
    paths:
      - 'local-agent/**'
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PY_EMBED_VERSION: "3.11.9"

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Resolve agent version ─────────────────────────────────────────────────
      # If workflow_dispatch provided a version, use it.
      # Otherwise read AGENT_VERSION from local-agent/agent/job_client.py.
      - name: Resolve agent version
        id: version
        working-directory: local-agent
        run: |
          $override = "${{ github.event.inputs.version }}".Trim()
          if ($override -ne '') {
            $ver = $override
            Write-Host "Version from workflow input: $ver"
          } else {
            # Read from source — pattern: AGENT_VERSION = "1.2.3"
            $content = Get-Content "agent\job_client.py" -Raw
            if ($content -match 'AGENT_VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
              $ver = $Matches[1]
              Write-Host "Version from job_client.py: $ver"
            } else {
              $ver = "1.0.20"
              Write-Warning "Could not parse AGENT_VERSION — falling back to $ver"
            }
          }
          Write-Host "::notice::Building version $ver"
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      # ── Stage agent source files ──────────────────────────────────────────────
      # Instead of compiling to an EXE (which triggers AV/Defender blocks),
      # ship the raw Python source.  The bundled Python embeddable (next step)
      # runs main.py directly — no binary, no false-positive detections.
      - name: Stage agent source files
        working-directory: local-agent
        run: |
          $dest = "dist\ThermopacAgent"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          # Copy Python source packages
          Copy-Item -Path "agent"     -Destination "$dest\agent"     -Recurse -Force
          Copy-Item -Path "extractor" -Destination "$dest\extractor" -Recurse -Force

          Write-Host "Staged source files:"
          Get-ChildItem $dest -Recurse | Select-Object FullName | Format-Table -HideTableHeaders

      # ── Download Python embeddable for bundling ───────────────────────────────
      # Provides dist\python\ so InnoSetup can bundle a complete Python runtime.
      # Users get a self-contained installer with no separate Python install.
      # run.bat uses this bundled python.exe to run agent\main.py directly.
      - name: Download and prepare Python embeddable
        working-directory: local-agent
        run: |
          $pyVer  = "${{ env.PY_EMBED_VERSION }}"
          $pyZip  = "python-$pyVer-embed-amd64.zip"
          $pyUrl  = "https://www.python.org/ftp/python/$pyVer/$pyZip"
          $tmpZip = "$env:TEMP\$pyZip"
          $pyDir  = "dist\python"

          Write-Host "Downloading Python $pyVer embeddable..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $pyUrl -OutFile $tmpZip -UseBasicParsing
          Write-Host "Downloaded: $tmpZip"

          New-Item -ItemType Directory -Path $pyDir -Force | Out-Null
          Expand-Archive -Path $tmpZip -DestinationPath $pyDir -Force
          Write-Host "Extracted Python to $pyDir"

          # Enable site-packages (required for pip and installed packages)
          $pth = Get-ChildItem $pyDir -Filter "python*._pth" | Select-Object -First 1
          if ($pth) {
            (Get-Content $pth.FullName) -replace '#import site','import site' | Set-Content $pth.FullName
            Write-Host "Enabled site-packages in $($pth.Name)"
          }

          # Install pip
          $getPip = "$env:TEMP\get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip -UseBasicParsing
          & "$pyDir\python.exe" $getPip --no-warn-script-location --quiet
          Write-Host "pip installed"

          # Install required packages into the embeddable Python
          & "$pyDir\python.exe" -m pip install pywin32 requests --no-warn-script-location --quiet
          Write-Host "pywin32 + requests installed"

          # pywin32 post-install: copies DLLs to the right locations
          $postinstall = Get-ChildItem $pyDir -Filter "pywin32_postinstall.py" -Recurse |
                         Select-Object -First 1
          if ($postinstall) {
            & "$pyDir\python.exe" $postinstall.FullName -install 2>&1 | Out-Null
            Write-Host "pywin32 post-install done"
          }

          # Quick smoke test: can the bundled python import win32com?
          $testOut = & "$pyDir\python.exe" -c "import win32com.client; print('win32com OK')" 2>&1
          Write-Host "Smoke test: $testOut"

          # Report size
          $sizeMB = [math]::Round((Get-ChildItem $pyDir -Recurse |
                    Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Python bundle size: $sizeMB MB"

      # ── Install Inno Setup 6 ──────────────────────────────────────────────────
      - name: Install Inno Setup 6
        run: |
          $out = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" `
            -OutFile $out -UseBasicParsing
          Start-Process -FilePath $out `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          Write-Host "Inno Setup 6 installed"

      # ── Patch version into setup.iss ──────────────────────────────────────────
      - name: Patch version in setup.iss
        working-directory: local-agent
        run: |
          $version = "${{ steps.version.outputs.ver }}"
          (Get-Content "installer\setup.iss") `
            -replace '#define AppVersion\s+"[^"]+"', "#define AppVersion      `"$version`"" |
            Set-Content "installer\setup.iss"
          Write-Host "Version patched to: $version"

      # ── Compile installer ─────────────────────────────────────────────────────
      - name: Build Inno Setup installer
        working-directory: local-agent
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) {
            Write-Error "ISCC.exe not found"
            exit 1
          }

          Write-Host "dist\ThermopacAgent contents:"
          Get-ChildItem "dist\ThermopacAgent" -Recurse -ErrorAction SilentlyContinue |
            Select-Object Name | Format-Table -HideTableHeaders

          Write-Host "dist\python top-level:"
          Get-ChildItem "dist\python" -ErrorAction SilentlyContinue |
            Select-Object Name | Format-Table -HideTableHeaders

          & $iscc "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit code $LASTEXITCODE"
            exit 1
          }

      # ── Verify installer ──────────────────────────────────────────────────────
      - name: Verify installer
        working-directory: local-agent
        run: |
          $version  = "${{ steps.version.outputs.ver }}"
          $installer = "installer_output\ThermopacAgent-Setup-v$version.exe"
          if (!(Test-Path $installer)) {
            Get-ChildItem installer_output -ErrorAction SilentlyContinue
            Write-Error "Installer not found: $installer"
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Installer OK: $installer ($sizeMB MB)"

      # ── SHA-256 checksum ──────────────────────────────────────────────────────
      - name: Compute checksums
        working-directory: local-agent
        run: |
          $version   = "${{ steps.version.outputs.ver }}"
          $installer = "installer_output\ThermopacAgent-Setup-v$version.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          "$hash  ThermopacAgent-Setup-v$version.exe" |
            Out-File "installer_output\SHA256SUMS.txt" -Encoding utf8

      # ── Upload installer artifact ─────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermopacAgent-Setup-v${{ steps.version.outputs.ver }}
          path: |
            local-agent/installer_output/ThermopacAgent-Setup-v*.exe
            local-agent/installer_output/SHA256SUMS.txt
          retention-days: 30

      # ── Upload staged source (debugging) ──────────────────────────────────────
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermopacAgent-dist-v${{ steps.version.outputs.ver }}
          path: local-agent/dist/ThermopacAgent/
          retention-days: 7
